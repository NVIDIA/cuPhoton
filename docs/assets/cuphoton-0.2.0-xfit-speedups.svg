  <g id="text_31">
   <text style="fill: #536671; font: 17px 'DejaVu Sans'; text-anchor: start" x="67.32" y="856.44" transform="rotate(-0 67.32 856.44)">Eight workers share one GPU using CUDA MPS. Warm medians across six launches; startup excluded.</text>

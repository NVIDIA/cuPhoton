  <g id="text_30">
   <text style="fill: #172631; font: 19px 'DejaVu Sans'; text-anchor: start" x="67.32" y="826.488" transform="rotate(-0 67.32 826.488)">Pipeline: read FITS, subtract images, fit candidates and score them.</text>

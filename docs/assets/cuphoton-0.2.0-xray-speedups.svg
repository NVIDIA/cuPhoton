  </g>
  <g id="text_25">
   <text style="fill: #536671; font: 17px 'DejaVu Sans'; text-anchor: start" x="67.32" y="463.68" transform="rotate(-0 67.32 463.68)">One original run; median of five prototype runs. Solver, scheduling and output changed.</text>
  </g>
  <g id="text_26">
   <text style="fill: #536671; font: 18px 'DejaVu Sans'; text-anchor: start" x="67.32" y="493.92" transform="rotate(-0 67.32 493.92)">The six-minute result predates numerical repairs included in v0.2.</text>
  </g>
  <g id="text_27">
   <text style="fill: #172631; font: 700 25px 'DejaVu Sans'; text-anchor: start" x="67.32" y="541.296" transform="rotate(-0 67.32 541.296)">GB200 · v0.1.3 versus v0.2</text>
  </g>
  <g id="text_28">
   <text style="fill: #467800; font: 700 29px 'DejaVu Sans'; text-anchor: end" x="1156.68" y="541.296" transform="rotate(-0 1156.68 541.296)">&gt;13× faster</text>
  </g>
  <g id="text_29">
   <text style="fill: #536671; font: 17px 'DejaVu Sans'; text-anchor: start" x="67.32" y="851.76" transform="rotate(-0 67.32 851.76)">GB200: one baseline timeout; median of six complete v0.2 runs, including startup and output.</text>
  </g>
  <g id="text_30">
   <text style="fill: #536671; font: 17px 'DejaVu Sans'; text-anchor: start" x="67.32" y="882" transform="rotate(-0 67.32 882)">The structured solver writes compact output. The old run did not finish; its time is a lower bound.</text>
  </g>
  <g id="text_31">
   <text style="fill: #172631; font: 18px 'DejaVu Sans'; text-anchor: start" x="67.32" y="930.384" transform="rotate(-0 67.32 930.384)">Each comparison uses the same GPU model and input workload within its panel.</text>
  </g>
  <g id="text_32">
   <text style="fill: #536671; font: 17px 'DejaVu Sans'; text-anchor: start" x="67.32" y="962.64" transform="rotate(-0 67.32 962.64)">These are workflow timings; they do not establish identical numerical outputs.</text>
  </g>

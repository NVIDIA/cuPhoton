project:
  type: book
  resources:
    - assets/**

book:
  title: "cuPhoton User Guide"
  site-url: https://nvidia.github.io/cuPhoton/
  subtitle: "Install cuPhoton, run your first image difference, then follow task guides for each module."
  author: "cuPhoton contributors"
  date: today
  navbar:
    title: "cuPhoton"
    logo: assets/nvidia-logo.png
    logo-alt: "NVIDIA"
    background: dark
    pinned: true
    right:
      - icon: github
        text: Source
        href: https://github.com/NVIDIA/cuPhoton
  sidebar:
    title: "User guide"
    style: docked
    collapse-level: 2
  page-footer:
    left: "NVIDIA · cuPhoton"
    right: "Built with Quarto"
  chapters:
    - index.qmd
    - part: "Get started"
      chapters:
        - install.qmd
        - first-difference.qmd
        - concepts.qmd
    - part: "How-to guides"
      chapters:
        - read-fits.qmd
        - align.qmd
        - subtract.qmd
        - measure.qmd
        - classify.qmd
        - transient-chain.qmd
        - uncertainty.qmd
        - reconstruct.qmd
        - xray-traces.qmd
        - correlate.qmd
        - scale.qmd
        - monitor.qmd
  appendices:
    - reference.qmd

execute:
  freeze: auto
  warning: false

lightbox: auto

format:
  html:
    theme:
      dark: [darkly, nvidia.scss, theme-dark.scss]
      light: [flatly, nvidia.scss, theme-light.scss]
    toc: true
    number-sections: true
    code-copy: true
    code-overflow: wrap
    fig-width: 6.5
    fig-height: 4
    fig-dpi: 150
    fig-align: center

# Prepared pair dataset and self-contained run destination.
dataset_dir: data/hsc-domain
output_root: runs
run_name: pair-example
epochs: 4
batch_size: 16
learning_rate: 0.001
weight_decay: 0.0
seed: 0
# `auto` prefers CUDA and records the resolved device.
device: auto
train_split: train
val_split: val
eval_split: test
performance:
  # Mixed precision and worker settings should match the target hardware.
  amp_dtype: bf16
  allow_tf32: true
  cudnn_benchmark: true
  compile: false
  compile_mode: null
  compile_backend: null
  compile_threads: 1
  compile_worker_start_method: spawn
  worker_start_method: spawn
  worker_cpu_threads: 1
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  non_blocking_transfers: true
model:
  # Pair mode consumes search and template; image_size must match the dataset.
  input_mode: pair
  image_size: 51
  depths: [3, 3, 3, 3, 3, 3]
  num_heads: [2, 2, 4, 8, 8, 8]
  embed_dims: [64, 128, 256, 512, 512, 512]
  decoder_embedding_dim: 64
  pos_dim: 16
  output_nc: 2
  drop_rate: 0.2
  attn_drop: 0.2

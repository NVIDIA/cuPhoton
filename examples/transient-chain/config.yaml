# Parameters of the GPU-resident chain, grouped by the stage that reads them. Unknown blocks or keys are
# rejected at load; keys marked (required) have no default. Override any key from the command line with
# --set block.key=value. The values below are those of the file-based reference chain on Rubin DP1.

io:
  reader: auto                # auto: xDR GPU decode when the file and environment allow it, Astropy otherwise
                              # xdr: insist on the GPU decoder (fails early on RICE, scaled or quantized images)
                              # astropy: host decode, then copy to the device

survey:
  name: rubin                 # rubin: DP1 layout (HDU 1/2/3, MP_ mask cards, hsc-masklite, coadd-patch mosaic)
  params: {}                  # generic: see README "Other surveys" for the parameter block

align:                        # template on the target grid, then star-based refinement (worker step 2-3)
  refine: true
  star_finder: gpu            # gpu: device peaks + windowed centroids; daofind: photutils DAOStarFinder on host copies
  mapping_grid_step: 100      # WCS evaluated every this many output pixels (xRep default)
  min_affine_matches: 15      # fewer matches than this: fall back to a pure shift
  min_shift_matches: 4        # fewer than this: skip refinement
  star_fwhm_px: 4.0           # (required) smoothing FWHM of the star finder
  star_threshold_sigma: 20.0  # (required) star detection threshold in robust sigmas
  max_stars: 600
  star_box_px: 15             # gpu finder: centroid window (odd); also the neighbor radius of the misalignment stars
  centroid_iterations: 4      # gpu finder: windowed-centroid passes
  match_radius_px: 8.0        # (required) visit-template star match radius before refinement
  verify_radius_px: 5.0       # (required) match radius for the residual check after refinement
  xcorr_window_px: 512        # central window for the cross-correlation diagnostic

subtract:                     # cuphoton.xpois.solve_constant_kernel_device (step 4-5)
  kernel_height: 15           # (required, odd)
  kernel_width: 15            # (required, odd)
  basis_sigmas: [1.5, 3.0, 6.0]   # (required) Gaussian basis widths
  basis_degrees: [2, 1, 0]        # (required) polynomial degree per basis
  background_degree: 0
  flux_conserve: false
  template_bad_dilation_px: 0 # grow the template's bad mask; a 3 px dilation covers the Lanczos-3 footprint that
                              # the library's device mask propagation does not (see README "Known issues")
  auto_stamp_mask: true       # restrict the kernel fit to compact sources
  auto_stamp_size: 31
  auto_stamp_count: 5
  auto_peak_percentile: 99.5
  auto_background_filter_size: 15
  auto_peak_filter_size: 9
  auto_compact_core_size: 3

detect:                       # hotspot rule on the residual (step 6)
  threshold_sigma: 5.0        # (required)
  min_pixels: 3               # (required)

stamps:                       # step 7; stamp_size also sets detect's edge margin and the XScan input size
  stamp_size: 51              # (required, odd; must equal the checkpoint's image_size)

xfit:                         # cuphoton.xfit.fit_dipoles_device with the Gaussian dipole model (step 8)
  mode: difference
  compute_dtype: float64
  solver: {}                  # LMConfig fields: f_tol, x_tol, g_tol, max_evaluations, initial_damping,
                              # damping_increase, damping_decrease; empty = library defaults
  psf_sigma_px: null          # PSF standard deviation of the target image in pixels, measured independently of the
                              # candidate fits. Sets the quality flags' width range (0.5 to 2.5 times it) and the
                              # forced-photometry PSF; null = measured from the stars the refine stage matched
                              # (summary psf_sigma_source "stars"); without those stars the flags use xFit's default
                              # range and the psf_flux columns are NaN

uq:                           # the error budget behind <q>_err (step 8c; README "How the error bar is built")
  enabled: true               # false: <q>_err equals <q>_err_fit and every other term is 0
  kernel_fit: true            # the kernel fit's own uncertainty (kfit); one covariance per item over the fit pixels
  max_lobe_reach_px: 32       # largest center-to-lobe distance with a center error bar
  measure_correlation: true   # measure the correlation factor at empty positions of each exposure and use it for
  correlation_positions: 1000 # corr where it exceeds the closed form by over two standard errors; the positions
  sky_astrometry_arcsec: null # external astrometric uncertainty per axis, written to sky_err_arcsec; set with
  sky_astrometry_source: null # its provenance (e.g. the survey's astrometric summary), never added to pixel columns

classify:                     # XScan inference through DLPack (step 9); checkpoint_dir comes from --checkpoint-dir
  inference_policy: strict    # strict: float32, no autocast, no TF32; checkpoint: the policy saved with the checkpoint
  apply_noise_match: true     # scale each stamp triplet so the search stamp's robust sigma equals noise_reference_sigma
  noise_reference_sigma: 114.70530480194091   # a property of the CHECKPOINT, not the survey: the median robust sigma of
                              # the search stamps it was trained on; this value belongs to the checkpoint the chain was
                              # developed with. Change it when you change checkpoints; set apply_noise_match false to
                              # score unscaled stamps.
  decision_threshold: 0.5
  batch_size: 256

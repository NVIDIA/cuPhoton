name: Feature request
description: Propose a new cuPhoton capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - cuphoton.core
        - cuphoton.xdr
        - cuphoton.xfit
        - cuphoton.xpois
        - cuphoton.xscan
        - cuphoton.xrep
        - cuphoton.xray
        - repository infrastructure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or workflow gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the requested behavior and likely implementation scope.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How should maintainers verify this works?

name: Bug report
description: Report a reproducible problem in cuPhoton.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - cuphoton.core
        - cuphoton.xdr
        - cuphoton.xfit
        - cuphoton.xpois
        - cuphoton.xscan
        - cuphoton.xrep
        - cuphoton.xray
        - repository infrastructure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide commands, inputs, and a minimal reproducer when possible.
      render: bash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, CUDA, GPU, driver, and package revisions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true

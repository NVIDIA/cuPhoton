name: ci

on:
  push:
    branches: [main, 0.1.x]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUPHOTON_XDR_BUILD_EXT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_HTTP_TIMEOUT: "300"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --extra dev --python 3.11
      - run: make ci-lint

  test-cpu:
    name: tests / linux-x64 / py3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUPHOTON_XREP_TORCH_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv python install 3.11
      - run: >-
          uv sync --locked --python 3.11
          --extra dev --extra torch --extra viz
      - run: make ci-test-cpu
      - name: Run synthetic CPU quickstarts
        run: >-
          uv run --locked --extra dev --extra torch --extra viz
          python examples/run_quickstarts.py --profile cpu
          --output-dir "${RUNNER_TEMP}/cuphoton-quickstart"

  ci-required:
    name: ci-required
    needs: [lint, test-cpu]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CPU_RESULT: ${{ needs.test-cpu.result }}
        run: |
          if [[ "${LINT_RESULT}" != success || "${CPU_RESULT}" != success ]]; then
            printf 'Required CI jobs did not succeed: lint=%s, test-cpu=%s\n' \
              "${LINT_RESULT}" "${CPU_RESULT}"
            exit 1
          fi

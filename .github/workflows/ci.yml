name: ci

on:
  push:
    branches: [main, 0.1.x]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUPHOTON_XDR_BUILD_EXT: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_HTTP_TIMEOUT: "300"

jobs:
  lint:
    timeout-minutes: 15
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - run: make ci-lint

  test-cpu:
    timeout-minutes: 30
    name: tests / ${{ matrix.name }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            python: "3.12"
          - name: linux-x64
            runner: ubuntu-24.04
            python: "3.13"
          - name: linux-x64
            runner: ubuntu-24.04
            python: "3.14"
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            python: "3.12"
    runs-on: ${{ matrix.runner }}
    env:
      CUPHOTON_XREP_TORCH_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: ""
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv python install "${PYTHON_VERSION}"
      - run: >-
          uv sync --locked --python "${PYTHON_VERSION}"
          --extra dev --extra torch --extra viz --extra photometry
      - run: make ci-test-cpu
      - name: Run synthetic CPU quickstarts
        if: matrix.name == 'linux-x64' && matrix.python == '3.12'
        run: >-
          uv run --locked --extra dev --extra torch --extra viz --extra photometry
          python examples/run_quickstarts.py --profile cpu
          --output-dir "${RUNNER_TEMP}/cuphoton-quickstart"

  package:
    name: native distributions
    uses: ./.github/workflows/wheels.yml

  ci-required:
    name: ci-required
    needs: [lint, test-cpu, package]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CPU_RESULT: ${{ needs.test-cpu.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          for result in "${LINT_RESULT}" "${CPU_RESULT}" "${PACKAGE_RESULT}"; do
            test "${result}" = success || exit 1
          done

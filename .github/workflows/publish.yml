name: publish

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Successful push CI run containing the qualified distributions
        required: true
        type: string
      version:
        description: Release version matching an existing v-prefixed tag
        required: true
        type: string
      target:
        description: Protected publishing environment
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.1"
      - name: Verify CI provenance and release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > run.json
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          version = os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:rc[0-9]+)?', version), version
          run = json.load(open('run.json'))
          assert run['conclusion'] == 'success', run['conclusion']
          assert run['event'] == 'push', run['event']
          assert run['path'] == '.github/workflows/ci.yml', run['path']
          assert run['head_branch'] in ('main', '0.1.x'), run['head_branch']
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          tag = subprocess.check_output(
              ['git', 'rev-parse', f'refs/tags/v{version}^{{commit}}'], text=True
          ).strip()
          assert tag == run['head_sha'], (tag, run['head_sha'])
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cuphoton-distributions
          path: dist
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify all six wheels and the source archive
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/wheels/check_distributions.py dist --version "$RELEASE_VERSION"
          uvx --isolated --from twine==6.2.0 twine check --strict dist/*
          sha256sum dist/* >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

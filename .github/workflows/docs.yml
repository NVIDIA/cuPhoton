name: user guide
run-name: docs ${{ inputs.tag || 'main' }} / ${{ inputs.request_id || github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - .github/workflows/release-docs.yml
      - dev/**
      - docs/**
      - src/**
      - examples/**
      - pyproject.toml
      - uv.lock
      - setup.py
  workflow_dispatch:
    inputs:
      # Existing release tags retain their hook. Preserve this name and type.
      tag:
        description: "Release tag, main, or missing for eligible backfills"
        type: string
        default: main
      request_id:
        description: "Optional client request identifier for run tracking"
        type: string
        default: ""

permissions:
  contents: read

# Keep the lock from archive read through deployment. Queue every publication;
# a newer main run must not cancel a pending release or an active deployment.
concurrency:
  group: cuphoton-docs-publication
  queue: max
  cancel-in-progress: false

env:
  CUPHOTON_XDR_BUILD_EXT: "0"
  CUPHOTON_XREP_TORCH_DEVICE: cpu
  CUDA_VISIBLE_DEVICES: ""
  MPLBACKEND: Agg
  UV_HTTP_TIMEOUT: "300"

jobs:
  publish:
    name: publish user guide
    if: >-
      github.repository == 'NVIDIA/cuPhoton' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Controller code is always the main SHA that started this workflow.
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install developer tools
        run: uv sync --project dev --locked --python 3.12
      - name: Install Quarto
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/quarto.deb" \
            https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.36/quarto-1.9.36-linux-amd64.deb
          printf '%s  %s\n' \
            8c47762e78fe58642246a94d18f67eb332c1778b711e5bef991ef3c15490d83a \
            "$RUNNER_TEMP/quarto.deb" | sha256sum --check
          sudo dpkg --install "$RUNNER_TEMP/quarto.deb"
      - name: Retain snapshots and assemble the complete site
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_TAG: ${{ inputs.tag }}
          DOCS_REQUEST_ID: ${{ inputs.request_id }}
        run: >-
          uv run --project dev --locked python -m cuphoton_dev.publisher prepare
          --tag "$DOCS_TAG" --request-id "$DOCS_REQUEST_ID"
          --output "$RUNNER_TEMP/site"
      - name: Check the complete publication
        run: uv run --project dev --locked cuphoton dev docs-check "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the complete retained site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

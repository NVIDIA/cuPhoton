[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuphoton"
dynamic = ["version"]
description = "GPU-accelerated astronomy and imaging tools from NVIDIA."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "NVIDIA Corporation" }]
keywords = ["astronomy", "cuda", "gpu", "image-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=6.1.4",
  "h5py>=3.10",
  "numexpr>=2.10",
  "numpy>=2.0,<2.6",
  "pandas>=2.2",
  "pyarrow>=23.0",
  "PyYAML>=6.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
photometry = [
  "photutils>=3.0",
]
torch = [
  "torch>=2.13,<3",
]
viz = [
  "bokeh>=3.9",
  "pillow>=10.4",
  "tornado>=6.5.10",
]
io = [
  "cupy-cuda13x[ctk]>=14,<15; platform_system == 'Linux'",
  "cuda-toolkit[cufile]>=13,<14; platform_system == 'Linux'",
  "kvikio-cu13==26.6.*; platform_system == 'Linux'",
  "libkvikio-cu13==26.6.*; platform_system == 'Linux'",
  "nvidia-libnvcomp-cu13==5.2.*; platform_system == 'Linux'",
  "nvidia-nvcomp-cu13==5.2.*; platform_system == 'Linux'",
]
gpu = [
  "cuphoton[io,photometry]",
  "numba>=0.61,<0.66; platform_system == 'Linux'",
  "numba-cuda[cu13]>=0.30,<0.31; platform_system == 'Linux'",
  "torch>=2.13,<3; platform_system == 'Linux'",
]
cutile = [
  "cuda-tile>=1.4; python_version >= '3.12' and python_version < '3.14' and platform_system == 'Linux'",
  "cupy-cuda13x[ctk]>=14,<15; python_version >= '3.12' and python_version < '3.14' and platform_system == 'Linux'",
]
dev = [
  "setuptools>=83.0.0",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "ruff>=0.15.12",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/cuPhoton"
Documentation = "https://github.com/NVIDIA/cuPhoton/tree/main/docs"
Repository = "https://github.com/NVIDIA/cuPhoton.git"
Issues = "https://github.com/NVIDIA/cuPhoton/issues"

[project.scripts]
cuphoton = "cuphoton.core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false
script-files = ["scripts/cuphoton-openmpi-rank-exec"]

[tool.setuptools.dynamic]
version = { attr = "cuphoton.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cuphoton*"]

[tool.setuptools.package-data]
"cuphoton.xpois" = ["assets/*"]
"cuphoton.xscan" = ["assets/*"]
"cuphoton.xray" = ["templates/*.html"]

[tool.uv]
managed = true
package = true
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 78
target-version = "py312"
force-exclude = true
extend-exclude = [
  "*.ipynb",
  "papers",
  "agents",
  "data",
  "runs",
  "demo-data",
  "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/cuphoton/xpois/review_bokeh.py" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--import-mode=importlib"]
markers = [
  "real_data: opt-in tests that require caller-supplied observational data",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp312-manylinux_* cp313-manylinux_* cp314-manylinux_*"
build-frontend = { name = "build[uv]", args = ["--no-isolation"] }
before-all = "bash {package}/scripts/wheels/prepare_cfitsio.sh"
before-build = "bash {package}/scripts/wheels/install_build_dependencies.sh"
repair-wheel-command = "python {package}/scripts/wheels/repair_wheel.py {wheel} {dest_dir}"
test-command = "python -I {package}/scripts/wheels/test_installed.py --mode base"

[tool.cibuildwheel.linux]
archs = ["auto64"]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:ae21cd1c8220f773f9b5934f3b845d677494d4cd4b8981c1e416f654e8afa74e"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64@sha256:f2c063e4d418c18356490aa38ebd045a8e27a6e3e1f2284dd1fd62da1218789d"
environment = { CUPHOTON_XDR_BUILD_EXT = "1", CUPHOTON_XDR_CFITSIO_ROOT = "/opt/cuphoton-cfitsio", CUDA_HOME = "", CUDA_PATH = "" }

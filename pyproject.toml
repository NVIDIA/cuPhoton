[build-system]
requires = ["setuptools>=84.2.1", "setuptools-scm==10.3.4", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuphoton"
dynamic = ["version"]
description = "GPU-accelerated astronomy and imaging tools from NVIDIA."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/CCCL-3.1.2.txt"]
authors = [{ name = "NVIDIA Corporation" }]
keywords = ["astronomy", "cuda", "gpu", "image-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=7.2.0",
  "h5py>=3.10",
  "numpy>=2.0,<2.6",
  "pyarrow>=23.0",
  "PyYAML>=6.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
catalog = [
  "pandas>=2.2",
  "numexpr>=2.10",
]
ximage = [
  "cuphoton[torch,photometry]",
  "pydantic>=2.11,<3",
  "zarr>=3,<4",
]
rubin = [
  "lsst-images[https]==30.0.10",
]
xlens-inference = [
  "httpx>=0.28,<1",
]
photometry = [
  "photutils>=3.0",
]
torch = [
  "torch>=2.13,<3",
]
viz = [
  "bokeh>=3.9",
  "pillow>=13.0.0",
  "tornado>=6.6",
]
io = [
  "cuda-pathfinder>=1.5.6,<2; platform_system == 'Linux'",
  "cuda-bindings>=13,<14; platform_system == 'Linux'",
  "cupy-cuda13x[ctk]>=14,<15; platform_system == 'Linux'",
  "cuda-toolkit[cufile]>=13,<14; platform_system == 'Linux'",
  "kvikio-cu13==26.6.*; platform_system == 'Linux'",
  "libkvikio-cu13==26.6.*; platform_system == 'Linux'",
  "nvidia-libnvcomp-cu13==5.2.*; platform_system == 'Linux'",
  "nvidia-nvcomp-cu13==5.2.*; platform_system == 'Linux'",
]
gpu = [
  "cuphoton[io,photometry]",
  "torch>=2.13,<3; platform_system == 'Linux'",
]
cutile = [
  "cuda-tile>=1.6,<2; platform_system == 'Linux'",
  "cupy-cuda13x[ctk]>=14,<15; platform_system == 'Linux'",
]
mpi = [
  "mpi4py>=4.1.2,<5",
]
dragon = [
  "dragonhpc>=0.14.2,<0.15",
]
dev = [
  "coverage>=7.10.6,<8",
  "mypy==1.19.1",
  # xImage configuration models are checked even without its runtime extra.
  "pydantic>=2.11,<3",
  "setuptools>=84.2.1",
  "pre-commit>=4.0",
  "virtualenv>=21.15.4",
  "pytest>=8.3",
  "ruff>=0.15.12",
  "types-PyYAML>=6.0.12",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/cuPhoton"
Documentation = "https://github.com/NVIDIA/cuPhoton/tree/main/docs"
Repository = "https://github.com/NVIDIA/cuPhoton.git"
Issues = "https://github.com/NVIDIA/cuPhoton/issues"

[project.scripts]
cuphoton = "cuphoton.core.cli:main"

[dependency-groups]
docs = [
  "ipykernel>=6,<8",
  "nbclient>=0.10,<1",
  "matplotlib>=3.10,<4",
  "torch>=2.13,<3",
]
native-build = [
  "setuptools>=84.2.1",
  "setuptools-scm==10.3.4",
  "wheel",
  "pybind11>=3.0,<4",
]
notebook = [
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false
script-files = ["scripts/cuphoton-openmpi-rank-exec"]

[tool.setuptools_scm]
version_file = "src/cuphoton/_version.py"
# setup.py supplies the development version policy, including maintenance branches.
tag_regex = '^(?P<version>v[0-9]+\.[0-9]+\.[0-9]+(?:rc[0-9]+)?|[0-9]+\.[0-9]+\.x)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
version_file_template = '''
# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
#
# SPDX-License-Identifier: Apache-2.0

# Generated at build time by setuptools-scm. Do not edit.
__version__ = {version!r}
'''

[tool.setuptools.packages.find]
where = ["src"]
include = ["cuphoton*"]

[tool.setuptools.package-data]
"cuphoton.xbeam" = ["schemas/*.json"]
"cuphoton.xlens" = ["assets/*.html", "assets/*.css", "assets/*.js"]
"cuphoton.xpois" = ["assets/*"]
"cuphoton.xscan" = ["assets/*"]
"cuphoton.xray" = ["templates/*.html", "src/*.cu"]

[tool.uv]
managed = true
package = true
environments = ["sys_platform == 'linux'"]
# Keep the guide's CPU Torch installation separate from the GPU profile.
conflicts = [[{ group = "docs" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "docs" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 78
target-version = "py312"
force-exclude = true
extend-exclude = [
  "*.ipynb",
  "papers",
  "agents",
  "./data",
  "runs",
  "demo-data",
  "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Runtime callers inspect expanded aliases with get_args()/get_origin().
"src/cuphoton/xfit/_types.py" = ["UP040"]
"src/cuphoton/xray/_types.py" = ["UP040"]
"src/cuphoton/xscan/types.py" = ["UP040"]
"src/cuphoton/xpois/review_bokeh.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/cuphoton"]
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

# Scientific and GPU libraries without consistent stubs across dev profiles.
# Skip their implementations even when installed so CPU and GPU checks agree.
[[tool.mypy.overrides]]
module = [
  "astropy.*", "bokeh.*", "cuda.*", "cupy.*", "cupyx.*", "dragon.*",
  "h5py.*", "httpx.*", "kvikio.*", "mpi4py.*", "nvidia.*", "nvtx.*",
  "pandas.*", "photutils.*", "PIL.*", "pyarrow.*", "pybind11.*",
  "scipy.*", "setuptools.*", "torch.*", "zarr.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--import-mode=importlib"]
markers = [
  "gpu: synthetic numerical checks that require a CUDA device",
  "real_data: opt-in tests that require caller-supplied observational data",
  "xray_gpu: structured xRay tests requiring CUDA 13 execution",
]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/cuphoton"]
relative_files = true
parallel = true
concurrency = ["multiprocessing", "thread"]
patch = ["subprocess"]
omit = ["src/cuphoton/_version.py"]

[tool.coverage.xml]
output = "coverage.xml"

[tool.cibuildwheel]
build = "cp312-manylinux_* cp313-manylinux_* cp314-manylinux_*"
build-frontend = { name = "build[uv]", args = ["--no-isolation"] }
before-all = "bash {package}/scripts/wheels/prepare_cfitsio.sh"
before-build = "bash {package}/scripts/wheels/install_build_dependencies.sh"
repair-wheel-command = "python {package}/scripts/wheels/repair_wheel.py {wheel} {dest_dir}"
test-command = "python -I {package}/scripts/wheels/test_installed.py --mode base"

[tool.cibuildwheel.linux]
archs = ["auto64"]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:ae21cd1c8220f773f9b5934f3b845d677494d4cd4b8981c1e416f654e8afa74e"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64@sha256:f2c063e4d418c18356490aa38ebd045a8e27a6e3e1f2284dd1fd62da1218789d"

[tool.cibuildwheel.linux.environment]
CUPHOTON_XDR_BUILD_EXT = "1"
CUPHOTON_XRAY_BUILD_EXT = "1"
CUPHOTON_XDR_CFITSIO_ROOT = "/opt/cuphoton-cfitsio"
CUPHOTON_XFIT_BUILD_EXT = "1"
CUPHOTON_XFIT_CUDA_ARCHS = "75,80,86,89,90a,100a,103a,120a,121a"
CUDA_HOME = "$(python -c 'import sysconfig; print(sysconfig.get_path(\"purelib\") + \"/nvidia/cu13\")')"
CUPHOTON_XFIT_CCCL_ROOT = "$(python -c 'import sysconfig; print(sysconfig.get_path(\"purelib\") + \"/cupy/_core/include/cupy/_cccl\")')"
